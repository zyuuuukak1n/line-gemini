services:
  line-gemini-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: line-gemini-bot
    restart: unless-stopped
    ports:
      # 外部へ直接公開せず、ホストのループバックアドレスにバインド（承認済みポート: 8090）
      - "127.0.0.1:8090:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

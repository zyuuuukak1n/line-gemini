name: CI Test & Lint

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest
      env:
        LINE_CHANNEL_SECRET: dummy_secret_for_ci
        LINE_CHANNEL_ACCESS_TOKEN: dummy_token_for_ci
        GEMINI_API_KEY: dummy_api_key_for_ci
      run: |
        pytest -v
